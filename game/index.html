<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Duel — a card battler</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">EMBERFALL <span>DUEL</span></div>
    <div id="roundTag">Round 1</div>
    <button id="muteBtn" type="button" title="Toggle sound (M)">Sound: on</button>
  </header>

  <section id="foeZone" aria-label="Opponent">
    <div class="fighter">
      <div class="fighterName">MORVANE, THE WARDEN</div>
      <div class="hpBar"><div id="foeHpFill" class="hpFill foe"></div><span id="foeHpText" class="hpText">20 / 20</span></div>
      <div id="intentBox">Intent: <b id="intentText">—</b></div>
    </div>
    <div id="foeHand" class="handRow small"></div>
  </section>

  <section id="arena" aria-label="Clash arena">
    <div id="arenaLeft" class="arenaSlot"></div>
    <div id="arenaMid">
      <div id="clashBanner">Pick a card to strike</div>
      <div id="comboTag"></div>
    </div>
    <div id="arenaRight" class="arenaSlot"></div>
  </section>

  <section id="heroZone" aria-label="Player">
    <div id="heroHand" class="handRow big"></div>
    <div class="fighter heroSide">
      <div class="fighterName">YOU</div>
      <div class="hpBar"><div id="heroHpFill" class="hpFill hero"></div><span id="heroHpText" class="hpText">20 / 20</span></div>
      <div id="energyBox">Energy <b id="energyText">4</b> · Block <b id="blockText">0</b></div>
      <button id="endTurnBtn" type="button">End turn (Space)</button>
    </div>
  </section>

  <div id="logLine" role="status"></div>

  <div id="overlay" class="hidden">
    <div id="overlayCard">
      <h1 id="overlayTitle">EMBERFALL DUEL</h1>
      <p id="overlayText"></p>
      <div id="overlaySuits"></div>
      <button id="overlayBtn" type="button">Start duel</button>
      <p id="overlayHint">Click a card or press 1–5 · Space ends turn · M mutes</p>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
